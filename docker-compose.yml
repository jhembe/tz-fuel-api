services:
  api:
    build: .
    container_name: tz-fuel-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fuel_app:TzFuel2026!@postgres:5432/tz_fuel
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-change-me}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - edge_net
      - data_net

networks:
  edge_net:
    external: true
  data_net:
    external: true
